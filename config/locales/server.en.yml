en:
  site_settings:
    robot_mcp_enabled: "Enable the Robot MCP tools (IT-Wiki documentation through the Discourse MCP server)."
    robot_mcp_wiki_category_id: "IT-Wiki category: robot_wiki_create_topic and robot_wiki_reply write only here, and robot_create_topic uses it when no category is given."
    robot_mcp_read_categories: "Limit robot_search and robot_read_topic to these categories (plus the wiki category). Leave empty to allow everything the logged-in user can see (private messages are never included). robot_reply and robot_create_topic follow the user's normal forum permissions."
    robot_mcp_allowed_groups: "Groups whose members may use the Robot MCP tools."
    robot_mcp_erp_task_url: "ERP form for logging time on a forum post (same as the post-menu button). The tools append url, user, topicId, postId and postNumber. Empty disables the link."
